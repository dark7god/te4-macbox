name: macbox
on: workflow_dispatch
jobs:
  box:
    runs-on: macos-15          # Apple-silicon M1 runner
    timeout-minutes: 360       # GitHub's per-job maximum
    steps:
      - name: Deploy key
        env:
          KEY: ${{ secrets.TE4_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/te4_deploy && chmod 600 ~/.ssh/te4_deploy
          ssh-keyscan git.net-core.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host git.net-core.org
            IdentityFile ~/.ssh/te4_deploy
            IdentitiesOnly yes
          EOF
      - name: Tools
        run: brew install ninja
      - name: Shell
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
