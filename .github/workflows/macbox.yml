name: macbox
on: workflow_dispatch
jobs:
  box:
    runs-on: macos-15          # Apple-silicon M1 runner
    timeout-minutes: 360       # GitHub's per-job maximum
    steps:
      - name: Deploy key
        env:
          KEY: ${{ secrets.TE4_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan git.net-core.org >> ~/.ssh/known_hosts
      - name: Tools
        run: brew install ninja
      - name: Shell
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
